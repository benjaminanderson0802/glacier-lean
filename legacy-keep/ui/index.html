<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLACIER · Workforce Control</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/desktop.css"><script type="module" src="/app.js"></script></head>
<body><a class="skip" href="#main">Skip to workspace</a>
<header><img class="ice-mark" src="/assets/glacier-mountain.png" alt=""><strong>Glacier OS</strong><span class="edition">SMALL STEPS · BIGGER THINGS</span><span class="spacer"></span><label class="presentation-picker">View <select id="presentation-mode" aria-label="Presentation mode"><option>RAW</option><option selected>COMPACT</option><option>EXPANDED</option></select></label><span id="connection">CONNECTING</span><button data-action="ui-update" title="Load the newest locally installed interface">RELOAD UI</button><button id="theme" title="Switch theme (Alt+T)">LIGHT MODE</button><button data-action="local-help" title="Local startup and keyboard help (F1)">?</button><button data-action="workspace-width" aria-label="Toggle expanded workspace" title="Expand workspace"><img class="window-icon" src="/icon-expand.svg" alt=""></button></header>

<div class="shell"><nav id="nav" aria-label="Main destinations"></nav><main id="main" tabindex="-1"><div class="startup"><h1>Glacier OS</h1><p>Opening your local workspace…</p><p>No Glacier account required.</p></div></main></div>
<footer><div class="command-bar"><span id="commands">F1 Help · F6 Focus area · Alt+1…9 Navigate</span><span id="status" role="status" aria-live="polite">LOCAL SERVICE</span></div><div class="desktop-bar"><a class="start-button" href="#assistant"><img class="pixel-icon" src="/assets/glacier-mountain.png" alt=""> Glacier</a><nav id="taskbar" aria-label="Desktop taskbar"></nav><time id="desktop-clock"></time></div></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="panel-title"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></dialog>
<div id="notice" role="status" aria-live="polite"></div>
</body></html>
