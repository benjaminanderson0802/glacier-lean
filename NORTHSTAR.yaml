# GLACIER NORTH STAR — canonical, machine-readable direction for every human and AI working on this project.
# Read this file in full before any task. Every unit of work must map to an item in `phases`.
# Change policy: see `amendment`. Never edit silently; never weaken an invariant to make a task "pass".
schema_version: 1
last_amended: 2026-10-08  # latest: owner trimmed non-building checkpoints (release, signing, studies, first-time tests, funding, annual review)
status_legend: {done: "verified by linked evidence", in_progress: "work started, not verified", todo: "not started", blocked: "needs a human decision (see open_decisions)"}

# ─────────────────────────────────────────────────────────────────────────────
# 1. WHY THIS EXISTS
# ─────────────────────────────────────────────────────────────────────────────
mission: >
  Let any person hand goals and recurring work to any mix of AI models and ordinary automation,
  on hardware they control, and accept results only on independent evidence — with memory they can
  read, every action approvable, auditable and undoable, and no lock-in to any single AI vendor.

gap_statement: >
  Each needed property exists somewhere (automation tools, agent frameworks, coding agents, note apps,
  chat front-ends, personal agents), but no product combines them, and the most consistently missing
  one is accepting AI work only on independent verification. The barrier for most people and small
  organizations is trust and skill, not model capability. Open standards (MCP, ACP, A2A, AG-UI,
  AGENTS.md) now make composing existing tools into this layer practical.
evidence:
  - {claim: "inaccurate self-reporting is 22.6% of coding-agent failure modes; 91% of resolved cases needed explicit human pushback", source: "https://arxiv.org/pdf/2605.29442"}
  - {claim: "74% of production agent teams rely on human verification; 85% build custom orchestration", source: "https://arxiv.org/html/2512.04123v3"}
  - {claim: "agents oversell success (1.8%) and circumvent oversight (1.9%), e.g. --no-verify", source: "https://www.lesswrong.com/posts/smE9h9RnaK7FWKBZ2/measuring-coding-agent-misalignment-in-the-wild-1"}
  - {claim: "AI use under 20% and flat at US firms with <20 employees vs 37% at 250+", source: "https://census.gov/library/stories/2026/05/ai-use-businesses.html"}
  - {claim: "vendor terms can revoke subscription access in third-party tools (Anthropic, April 2026)", source: "https://www.implicator.ai/anthropic-cuts-openclaw-from-claude-subscriptions-citing-unsustainable-compute-costs/"}
  - {claim: "agents with private data + untrusted input + outbound access are inherently exploitable (lethal trifecta)", source: "https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/"}

who_it_serves:   # in order of priority for design decisions
  - first_user: "the project owner, daily, on a Windows PC with ChatGPT/Codex access and local hardware"
  - next: "non-programmers and small organizations who cannot afford engineers to wire and babysit AI"
  - then: "people in low-bandwidth / low-budget settings (local models, offline-capable, free tools)"
  - also: "developers who want a trustworthy, portable layer instead of one vendor's agent"

# ─────────────────────────────────────────────────────────────────────────────
# 2. WHAT GLACIER IS (the 8 defining properties). Each has a test that proves it.
# ─────────────────────────────────────────────────────────────────────────────
defining_properties:
  - id: P-VERIFY
    statement: "Work counts as done only when an independent check passes (deterministic test, schema check, separate reviewer model, or human sign-off) — never on the worker's own report."
    test: "false_done_rate metric < 2% on the verification benchmark; workers cannot modify or skip their own checks"
  - id: P-GOALS
    statement: "The unit of work is a goal, decomposed into an Environment (graph) of AI workers and ordinary steps."
    test: "a goal entered in plain language becomes a runnable Environment the user can inspect before running"
  - id: P-LOOPS
    statement: "Recurring automations mix AI and non-AI steps, survive crashes and restarts, retry by policy, and alert on breakage."
    test: "kill -9 mid-run resumes without repeating finished steps; scheduled runs fire after restart; a broken step alerts the user"
  - id: P-MEMORY
    statement: "Memory is local, human-readable plain files under version control, shared by every worker and harness."
    test: "memory is fully readable/editable in a plain editor and Obsidian; any change can be reverted; all workers see the same notes"
  - id: P-PORTABLE
    statement: "Any model or harness (local, subscription CLI, API) is swappable through open protocols; no single vendor is required."
    test: "the same goal completes and verifies after swapping worker backends (e.g. Codex → local model → another CLI)"
  - id: P-CONTROL
    statement: "Approvals before consequential actions, one-step rollback, and a complete audit trail are defaults, not options."
    test: "100% of side effects appear in the audit log; injected bad change is rolled back in one action; approvals survive restarts"
  - id: P-SECURE
    statement: "Secure by default: sandboxed execution, outbound-network allowlists, reviewed capabilities, no unauthenticated exposure."
    test: "passes the prompt-injection / lethal-trifecta test suite; no network listener without auth"
  - id: P-USABLE
    statement: "A non-programmer can get value without learning the machinery; complexity is available, never required."
    test: "median time-to-first-working-automation < 30 min for first-time non-programmers (moderated test, n >= 10)"

# ─────────────────────────────────────────────────────────────────────────────
# 3. INVARIANTS — never violated by any change. A task that requires breaking one stops and escalates.
# ─────────────────────────────────────────────────────────────────────────────
invariants:
  - I-01: "Free and open source first, always. Use an existing, maintained, OSI-licensed tool when it covers >= 80% of a need; custom code only for glue, the assistant, and the user experience. A paid or closed-source tool is never adopted by an agent: it enters only through an owner-approved gap proposal (see claims)."
  - I-02: "The orchestrator must never become the product. If infrastructure work exceeds user-visible progress for two consecutive checkpoints, stop and re-plan."
  - I-03: "Tests are written before the feature; 'done' = its acceptance test passes in the shared sandbox, with evidence committed."
  - I-04: "No worker may edit, disable or bypass the check that judges its own work."
  - I-05: "User data stays on user-controlled hardware unless the user explicitly routes it elsewhere; every outbound destination is visible."
  - I-06: "Memory is plain files + git; any database is a rebuildable index, never the only copy."
  - I-07: "No dependence on reusing a vendor's consumer login inside third-party code against its terms; drive official CLIs/APIs only."
  - I-08: "Every consequential side effect (spend, send, publish, delete, external write) requires an approval rule and is logged."
  - I-09: "Every dependency is version-pinned; upgrades are deliberate and re-run the full test board."
  - I-10: "Bundled components must allow redistribution (MIT/Apache/BSD/MPL); restrictive ones (SUL, ELv2, AGPL, branding clauses) run only as separate optional processes."
  - I-11: "No repair loop runs unbounded: at most 2 self-fix attempts (the second starts from a fresh context, not a patch on the failed one; hard cap 3), and any stuck signal (see escalation) ends self-fixing immediately; then the worker files a claim. A human is reached only through a claim the system could not resolve."
  - I-12: "Bookkeeping is generated from the event log, never hand-appended status files."
  - I-13: "Cost and model/route used are visible per run."
  - I-14: "Safety rules may only be tightened by agents; loosening requires a human amendment to this file."
  - I-15: "Every gap, blocker or missing capability becomes a claim (plain markdown file in the vault, git-tracked). No claim is closed without linked evidence; no claim is silently dropped."
  - I-17: "Every screen is designed for non-technical people first: plain words, no jargon or internal labels, sensible defaults; technical detail is available but never required. A screen is not done until a first-time non-programmer can use it without help."
  - I-16: "Workers troubleshoot only inside their own lane and budget; anything outside their specialty, permissions or budget is escalated by claim, never improvised."

non_goals:
  - "Training or hosting foundation models."
  - "A custom workflow engine, scheduler, vector database, chat framework or canvas library (use existing ones)."
  - "Live scraping/syncing of consumer chat apps against their terms (use official exports/APIs)."
  - "Enterprise multi-tenant SaaS before the single-user local product meets its metrics."
  - "Features with no path to a defining property or a phase exit criterion."

# ─────────────────────────────────────────────────────────────────────────────
# 3b. CLAIMS & ESCALATION — how problems and gaps move through the system
# ─────────────────────────────────────────────────────────────────────────────
escalation:   # what a worker does when it hits a problem. Chosen from Jul–Oct 2026 research (sources below); judgment calls marked.
  self_fix_allowed_when: "the error is inside the worker's own task and specialty (its code, its test failure, a typo, a missing import) AND it can name a concrete next attempt"
  before_editing: "reproduce the problem and write down its assumptions first (decisive errors happen early and symptoms lag ~10 steps)"
  self_fix_budget: "2 attempts; the 2nd is a fresh attempt from a clean prompt plus a one-line error summary, not a patch on the failed one; hard cap 3"
  stuck_signals:   # any one ends self-fixing immediately and files a claim
    - "same command gives the same error 3 times"
    - "same action gives the same result 4 times"
    - "two actions alternate back and forth 6 times"
    - "the worker's stated cause of the failure is unchanged across 2 attempts"
  time_backstop: "15 minutes for cloud models; 40 minutes for local models (judgment call: slower models are penalized by fixed clocks)"
  file_claim_immediately_when:
    - "the cause is outside its lane: environment/sandbox, dependency or version conflict, licensing, security, another worker's output, missing credentials or permissions"
    - "the fix needs a tool, library or capability that is not installed or not known"
    - "the fix would touch its own acceptance check (I-04) or loosen a safety rule (I-14)"
    - "the fix would cost money, send/publish anything, or delete data (I-08)"
    - "the requirement itself is unclear"
    - "it is not confident what the failure means"
  never: ["keep retrying past budget", "weaken or skip a test to get green", "adopt a paid/closed tool", "mark the task done while a claim on it is open", "edit a task another agent is editing (one editor per task)"]
  while_waiting: "the worker parks its task (state saved by the durable runtime) and takes other ready work; at most 3 parked tasks per worker (judgment call); a task that other tasks depend on is never silently parked: its claim gets top priority"
  sources:
    - "https://arxiv.org/abs/2607.05197 (most repair gain in first 3-4 rounds, Jul 2026)"
    - "https://arxiv.org/html/2607.26117 (fresh retry beats repair, 2.5-5.5x cheaper; cap ~2, Jul 2026)"
    - "https://arxiv.org/html/2607.09510 (decisive error early; 82% of failed recoveries loop without progress, Jul 2026)"
    - "https://docs.openhands.dev/sdk/guides/agent-stuck-detector (repeat-count thresholds; vendor)"
    - "https://arxiv.org/html/2610.01471 (same- + different-model reviewers catch more together, Oct 2026)"
    - "https://arxiv.org/html/2606.05670 (more agents rarely beat one at equal budget, Jun 2026)"
    - "https://cognition.com/blog/multi-agents-working (clean-context reviewers; one writer at a time; vendor)"

claims:
  location: "vault/claims/<YYYY-MM-DD>-<slug>.md  (front-matter fields below; body = details and evidence)"
  fields: [id, filed_by, run_id, node_id, checkpoint, kind, summary, evidence, attempts_made, status, assigned_to, resolution, resolution_evidence]
  kinds:
    bug: "something broken that should work"
    environment: "sandbox, OS, install, network, permissions"
    capability_gap: "the system needs something it does not have (a tool, integration, model, feature)"
    skill_gap: "worker does not know how or keeps failing at it; goes to a stronger, different model"
    unclear_spec: "the requirement is ambiguous or contradictory; researcher first, then the owner if still unclear"
    policy: "would need money, publishing, deletion, a license exception, or a rule change"
  lifecycle: "filed → researching → (resolved | routed | proposed) → closed"
  automatic_research:   # starts the moment a claim is filed; no human needed
    - "Search the vault (past claims, decisions, notes) for the same problem — reuse a known fix first."
    - "Search for free/open-source solutions: maintained OSI-licensed projects, package registries, official docs, issue trackers. Record name, license, maintenance activity, adoption, fit %."
    - "Try the best candidate in an isolated sandbox branch with the claim's failing case as the test."
    - "Write findings with sources into the claim file."
  outcomes:
    resolved: "an existing fix or free/OSS tool works; its test passes; the original worker's task resumes"
    routed: "assigned to a specialist worker (see specialists); it fixes under the same verification rules"
    proposed: "no free/OSS option fits (or the fix needs money/policy change) → a gap proposal goes to the owner"
  gap_proposal_must_include: ["the problem in plain language", "every free/OSS option checked and why each fails", "paid/closed options with exact cost, license, lock-in and data-leaves-machine risk", "a recommended choice", "what happens if the owner says no (workaround or deferral)"]
  owner_actions: ["approve one option", "reject (task gets a workaround or is deferred)", "ask for more research"]
  triage: "before routing, every claim is sorted as environment, skill_gap, unclear_spec, capability_gap, bug or policy"
  specialists:   # 4 roles (research: fewer agents with one coordinator beat many); any model/harness can fill them
    researcher: "triage + past fixes in memory + free/open-source search + license scan (as a tool); handles capability_gap and unclear_spec"
    fixer: "environment, sandbox, installs, permissions, dependency/version problems (pins per I-09)"
    debugger: "skill_gap and bug claims a worker could not fix; uses a stronger model from a different vendor than the stuck worker"
    verifier: "confirms every resolution in a clean context with its own check (I-04); where possible two reviews: one same-model, one different-model"
  automated_gates: "security and license are automated checks plus a human gate, not agents"
  metrics: ["share of claims resolved without a human, per type: environment/dependency >= 90%, skill_gap 50-65%, unclear_spec mostly needs the owner; overall 60-70% at first, rising over time (judgment calls)", "false fixed rate caught by the verifier < 5%", "median time filed to resolved", "repeat claims for the same cause (target 0 after a fix is recorded)"]

# ─────────────────────────────────────────────────────────────────────────────
# 4. HOW DECISIONS ARE MADE (bias guards)
# ─────────────────────────────────────────────────────────────────────────────
decision_rules:
  evidence_over_opinion: "Choose by measured results in the sandbox; cite sources for external facts; label vendor-biased sources."
  maturity_over_novelty: "Prefer tools with sustained releases and real adoption; new tools only behind an adapter and with a fallback."
  no_originality_bias: "Building something ourselves needs a written reason why no existing tool fits."
  no_recency_bias: "A newer tool replaces an adopted one only if it measurably beats it on this file's metrics."
  no_authority_bias: "Neither the owner's phrasing nor an AI's preference overrides the defining properties; conflicts go to open_decisions."
  smallest_step: "Pick the smallest change that moves a phase checkpoint, verify it, then continue."
  reversibility: "Prefer reversible changes; irreversible ones need explicit human approval."

anti_patterns_to_detect:   # if observed, stop and correct course
  - "Agents generating reports instead of working software."
  - "A growing custom 'governance' layer that duplicates DBOS/MAF/git features."
  - "Tests that only test the test harness, or are rewritten to pass."
  - "Many tiny tasks with no user-visible change."
  - "Status claims without a linked passing test or artifact."
  - "Scope added that serves no defining property."

# ─────────────────────────────────────────────────────────────────────────────
# 5. METRICS (measured continuously from phase 3 on; targets are exit gates where noted)
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  - {id: M-FALSE-DONE, what: "share of runs marked done whose independent re-check fails", target: "< 2%"}
  - {id: M-VERIFIED, what: "share of completed goals with independent passing evidence", target: ">= 98%"}
  - {id: M-TTFA, what: "median minutes for a first-time non-programmer to a working recurring automation", target: "< 30"}
  - {id: M-COST, what: "cost (money + tokens) per verified completed task, by route", target: "tracked; trending down"}
  - {id: M-LOCAL, what: "share of steps run on local/small models without lowering M-VERIFIED", target: "tracked; maximized"}
  - {id: M-RECOVER, what: "median time to restore after an injected bad action", target: "< 2 min, one action"}
  - {id: M-INTERVENE, what: "human interventions per completed goal", target: "falls over time while M-VERIFIED holds"}
  - {id: M-PORTABLE, what: "portability swap test pass rate across >= 3 worker backends", target: "100%"}
  - {id: M-SURVIVE, what: "share of recurring automations still correct after 90 days", target: ">= 90%"}
  - {id: M-SECURITY, what: "prompt-injection suite pass rate; unauthenticated listeners", target: "100% pass; 0 listeners"}
  - {id: M-AUDIT, what: "share of side effects present in audit log", target: "100%"}

# ─────────────────────────────────────────────────────────────────────────────
# 6. PHASES — end to end. Work strictly follows dependencies. Each item: goal, checkpoints (testable), exit.
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: PH0
    name: "Foundation & proven toolset"
    goal: "Choose and prove the composed stack; remove replaced legacy code."
    status: done
    checkpoints:
      - {id: PH0.1, item: "Core tools proven in sandbox (MAF workflows, DBOS, ACP, Bifrost, vault+git+search, AG-UI, React Flow, xterm, Monaco)", status: done, evidence: "evidence/RESULTS.md; research doc 'Glacier Lean Stack'"}
      - {id: PH0.2, item: "Shared sandbox (GitHub Codespace) + private repo glacier-lean with pinned install", status: done, evidence: "repo commits 81d4294..5f17502"}
      - {id: PH0.3, item: "Legacy code mapped; 97% replaceable; keepers saved to legacy-keep/; old copies removed", status: done, evidence: "docs/OLD_CODE_MAP.md, legacy-keep/"}
      - {id: PH0.4, item: "Previous autonomous systems (Forge tasks, containers) disabled", status: done, evidence: "session log 2026-10-06"}

  - id: PH1
    name: "Core runtime (no AI): draw → save → run → survive → approve → remember"
    depends_on: [PH0]
    goal: "A durable, inspectable Environment runtime with a live canvas."
    status: in_progress
    checkpoints:
      - {id: PH1.1, item: "Environment file format in vault, one git commit per save", status: done, evidence: "backend test_save_environment_commits_to_vault"}
      - {id: PH1.2, item: "Node types schedule/command/check/approval/note; crash-safe runs; schedules; approvals across restart", status: done, evidence: "backend tests 1-7 pass in Codespace"}
      - {id: PH1.3, item: "Live canvas: edit, run, node states, terminal output, approve/reject, history, vault view", status: done, evidence: "e2e core.spec 19/19 vs real backend in Codespace"}
      - {id: PH1.4, item: "Loops with explicit iteration caps and visual loop edges; sub-environment node", status: done, test: "loop runs N times then exits; sub-environment run shows nested states", evidence: "backend tests test_loop_runs_n_times_then_exits, test_runaway_cycle_stops_at_step_limit, test_sub_flow_*, test_self_calling_flow_is_depth_limited (4 failed on old code); backend 19/19; browser e2e 30/30 incl. loop + sub-flow, commit 0bef5cf"}
      - {id: PH1.5, item: "Runs/node retries & timeouts configurable per node; breakage alert (Apprise/ntfy)", status: done, test: "failing scheduled step retries per policy then sends one alert", evidence: "backend tests test_command_retries_then_succeeds, test_command_retries_exhausted_fails, test_command_timeout, test_failed_run_sends_exactly_one_alert (4 failed on old code); backend 24/24; screen check 30/30 fake + 30/30 real backend 2026-10-06"}
      - {id: PH1.6, item: "Graceful shutdown (live-events socket must not block restart)", status: done, test: "SIGTERM stops backend < 5 s with clients connected", evidence: "backend test_graceful_shutdown_with_live_clients (failed on old code, passes on fix); backend suite 14/14 + browser e2e PASS in Codespace 2026-10-06"}
      - {id: PH1.7, item: "Windows run of the core (pywinpty terminal, paths, services)", status: done, test: "core test board passes on the owner's Windows PC", evidence: "PR #32 Windows portability (Linux-only parts skip with plain messages); cloud Windows CI paused by the $0 GitHub spending limit, so proof moves to the owner's PC install; PR #48 + follow-ups: GitHub Windows CI 396 passed / 0 failed on the PR and again on main (twice in a row); Windows job now blocking. Owner PC (Windows 11, real Codex/Ollama/granite installed, no global git identity, no Developer Mode) 2026-10-08 at main 5857351 after PR #125 test isolation and PR #116 Windows start-up fixes: backend core suite 573 passed, 27 skipped, 0 failed (serial run, 18 min)"}
    exit: "PH1.1–PH1.7 done; M-AUDIT = 100% for runtime side effects."

  - id: PH2
    name: "Workers & models"
    depends_on: [PH1]
    goal: "Any worker backend can be a node; routing and cost are visible."
    status: in_progress
    checkpoints:
      - {id: PH2.1, item: "Codex worker node using the user's ChatGPT sign-in (no API key)", status: done, evidence: "live check run 1e15bcca8897: codex created file, verified by command node"}
      - {id: PH2.2, item: "Local-model worker (Ollama/llama.cpp) via MAF agent node", status: done, test: "local model completes a task offline; result verified", evidence: "PR #6 nodes/local_ai.py; backend tests with a fake Ollama server (offline); live model check on the owner's PC pending PC installs"}
      - {id: PH2.3, item: "Model gateway (Bifrost) with per-node route, fallback chain and quota awareness", status: done, test: "primary unavailable → fallback used, logged, run still verified", evidence: "PR #19 gateway.py: fallback chain, daily caps, free-only (paid always refused, one policy claim per day); fake-server tests"}
      - {id: PH2.4, item: "ACP harness driver: OpenCode / Hermes / Gemini CLI etc. as worker nodes", status: done, test: "same goal completes via >= 2 ACP harnesses", evidence: "PR #10 ACP worker + PR #34 presets (codex-acp, opencode, custom); two different fake ACP agents pass the same check; PR #93 live proof: the same goal (create hello.txt) completed through OpenCode ACP (local qwen3:1.7b, Apache-2.0) and Codex ACP, both passing Glacier's check and an independent check (evidence/live/acp_two_harnesses.md); failures now explain themselves with exit status and last error lines"}
      - {id: PH2.5, item: "Per-run cost & route shown in UI (M-COST, M-LOCAL)", status: done, evidence: "backend PR #13; screen PR #54 Run view Usage panel (model, route, tokens, cost per run) + PR #56 Settings > Usage (spent, $0 paid cap, share done locally)"}
      - {id: PH2.6, item: "Laptop / second machine as a model provider over a private network", status: done, test: "gateway prefers laptop when online, falls back when offline", evidence: "PR #43 (cffd976): tests/test_gateway_preferred.py online route answers first, offline falls back to local with usage naming the route, health cached 30s; tested with a simulated second machine, real laptop check at the owner PC install"}
    exit: "M-PORTABLE swap test passes across >= 3 backends."

  - id: PH3
    name: "Verification layer (the core differentiator)"
    depends_on: [PH2]
    goal: "Nothing is accepted on a worker's word."
    status: in_progress
    exit_decision: "Owner approved the PH3 exit on 2026-10-07: verification 0% false-done / 100% verified, security 28/28 blocked, claims benchmark all per-type targets met with 0 wrong auto-resolutions; the overall 54% auto-resolution reflects a test mix that is half owner-only by design. Remaining PH3.9 is screen work."
    checkpoints:
      - {id: PH3.1, item: "Acceptance checks defined before work: test command, schema, rubric, or human sign-off per goal", test: "a goal without an acceptance check cannot start", status: done, evidence: "commit 87395ee; verify.validate on save, run with goal but no checks refused (400); tests in test_verification.py"}
      - {id: PH3.2, item: "Verifier node runs in a separate context/model from the worker; worker cannot alter it (I-04)", test: "worker attempts to edit the check are blocked and logged", status: done, evidence: "commits 87395ee + 8fae168: checks run on a copy with protected files restored; ANY change to a protected check file fails the run (I-04)"}
      - {id: PH3.3, item: "Coding workers in isolated git worktrees; merge only when checks pass (merge queue)", test: "failing branch never merges; passing branch merges automatically", status: done, evidence: "commit 17124fc: isolate:true runs in a git worktree, merged to main only when verified, one at a time (lock); test_workspaces.py"}
      - {id: PH3.4, item: "Verification benchmark (goals with known answers + adversarial 'claims done but isn't' cases) and M-FALSE-DONE dashboard", status: done, evidence: "verification 0% false-done / 100% verified (bc52a5d); security 28/28 (PR #24); claims benchmark PR #36 (first run: FAIL 50% overall, bench fake-researcher bug being fixed; proof rule tightened 4cc6a9f)"}
      - {id: PH3.5, item: "Circuit breakers (I-11) built into runs", test: "second failed attempt or any stuck signal files a claim with the attempts attached", status: done, evidence: "commit 87395ee: same failure twice or 3 failures stops the run and files a bug claim with attempts attached"}
      - {id: PH3.6, item: "Claim filing: file_claim tool (vault MCP) available to every worker; claim files git-tracked", test: "worker hitting an out-of-lane error files a correct claim and parks its task", status: done, evidence: "PR #22: MCP file_claim tool (validated worker author); claims git-tracked"}
      - {id: PH3.7, item: "Automatic claim research workflow (vault search → free/OSS search → sandbox trial → findings)", test: "seeded claim with a known OSS fix is resolved with no human, with sources and passing test", status: done, evidence: "commit 6a7f4ed: research workflow (past fixes, free/OSS research via Codex, routing); test_claims_research.py"}
      - {id: PH3.8, item: "Triage + routing to the 4 specialist roles (researcher, fixer, debugger, verifier) and parked-task resume", test: "routed claim fixed by specialist; original task resumes and passes its check", status: done, evidence: "commit 8fae168: specialist repairs, proof re-run, resolved only on evidence else escalated to owner; test_claims_specialist.py + test_verification stuck test"}
      - {id: PH3.9, item: "Gap proposals in the screen: owner sees options/costs and approves or rejects", test: "claim with no OSS option produces a proposal; approve/reject updates claim and task", status: done, evidence: "backend proposals + decision API; PR #54 Claims list + Claim Detail with Approve / Reject / Ask for more research (e2e: decision updates the claim); claim-rerun PR: after a decision the claim offers Run it again to check, which re-runs the flow that raised it (proof re-run linked to the claim, noted in its history) and opens that run; View run now works for real claims (e2e + API tests)"}
    exit: "M-FALSE-DONE < 2% and M-VERIFIED >= 98% on the benchmark; claim auto-resolution meets the per-type targets in claims.metrics."

  - id: PH4
    name: "Shared memory"
    depends_on: [PH1]
    goal: "One readable memory every worker uses and the user can browse."
    status: in_progress
    checkpoints:
      - {id: PH4.1, item: "Vault service: single writer, git commit per change, keyword search, links, event log", status: done, evidence: "evidence/RESULTS.md memory test; backend vault.py"}
