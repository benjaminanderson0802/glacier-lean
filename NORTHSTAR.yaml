# ─────────────────────────────────────────────────────────────────────────────
# 7. DRIFT CONTROL — run at the start of every task and at every checkpoint
# ─────────────────────────────────────────────────────────────────────────────
drift_check:
  before_task:
    - "Which phase checkpoint does this task advance? If none → stop and ask."
    - "Are all depends_on phases at their exit (or is this item explicitly parallel-safe)?"
    - "Which defining property and metric does it serve?"
    - "Is there an existing free/open-source tool for it (I-01)? If not, file a capability_gap claim instead of building or buying."
    - "What is the acceptance test, written first (I-03)?"
  at_checkpoint:
    - "Run the full test board in the shared sandbox; commit evidence; update status + evidence here."
    - "Compare user-visible progress vs infrastructure work (I-02)."
    - "Re-read anti_patterns_to_detect; record any found and the correction."
  red_flags_requiring_human: ["changing an invariant", "spending money", "publishing/releasing", "deleting user data", "a new restrictive license", "two failed checkpoints in a row"]

open_decisions:   # require the owner; agents must not decide these. Decided items stay listed with the decision.
  - {id: D1, question: "Open-source license and timing (affects free code signing, contributors, commercial use)", needed_by: PH10.1, status: decided, decision: "Apache-2.0; repo goes public at the first usable release", decided: 2026-10-06, note: "2026-10-07 owner: repo made public early (secret scan passed); the launcher stays unannounced until the owner decides"}
  - {id: D2, question: "One product vs separate 'builder' and 'runner' modes for finished automations", needed_by: PH5, status: decided, decision: "One app with two views: full Build view and a simple Run view (finished automations, status, approvals)", decided: 2026-10-06}
  - {id: D3, question: "Primary desktop shell (pywebview vs Tauri)", needed_by: PH8.1, status: decided, decision: "Tauri, with the Python backend bundled as a sidecar", decided: 2026-10-06}
  - {id: D4, question: "Which paid or subscription model routes are acceptable by default and at what monthly cap", needed_by: PH2.3, status: decided, decision: "Default engine is the owner's subscription CLI (Codex); local models stay free. Owner decision 2026-10-08: OpenAI-compatible and Anthropic API engines are allowed, but only when the owner turns one on in Settings with their own key and sets a monthly cap there; Glacier shows spend and stops at that cap. No paid route is ever used without that owner action.", decided: 2026-10-08}

amendment:
  who: "Only the project owner approves changes to mission, defining_properties, invariants, non_goals, phases' exit criteria."
  how: "Propose a diff with evidence (data or sources) and the metric it improves; record it in docs/AMENDMENTS.md; bump last_amended."
  agents_may: "update status/evidence fields after verified checkpoints, and add checkpoints that serve an existing phase exit."
