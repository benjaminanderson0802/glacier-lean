name: health
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-health:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run integration health checks
        run: python setup/health_check.py
      - name: Save health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glacier-health-report
          path: health-report.json
          if-no-files-found: warn
          retention-days: 30
