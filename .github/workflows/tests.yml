# Runs on every push and pull request. Linux jobs block merges; the Windows job reports real test results
# while Windows portability issues are being resolved.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: setup/requirements.txt}
      - run: pip install -r setup/requirements.txt
      - run: git config --global user.email "ci@glacier.local" && git config --global user.name "glacier-ci"
      - name: backend tests
        working-directory: glacier/backend
        run: python -m pytest -q tests -n 4 -m "not serial"; a=$?; python -m pytest -q tests -m serial; b=$?; exit $(( a || b ))
      - name: other test suites (importers, templates, verification benchmark)
        run: python -m pytest -q $(ls -d glacier/importers templates bench tools/scan tools/catalog 2>/dev/null)

  screen-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: glacier/web/package-lock.json}
      - name: install
        working-directory: glacier/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: screen check (type check + build + browser test against the fake backend)
        working-directory: glacier/web
        run: npm run check:ui

  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: setup/requirements.txt}
      - run: pip install -r setup/requirements.txt
      - run: git config --global user.email "ci@glacier.local"; git config --global user.name "glacier-ci"
      - name: backend tests (Windows)
        id: windows-backend
        working-directory: glacier/backend
        run: |
          $bash = @("$env:ProgramFiles\Git\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bash) { throw "Git Bash was not found. Install Git for Windows to run the backend tests." }
          & $bash -lc 'python -m pytest -q tests -n 4 -m "not serial" -rf -o faulthandler_timeout=240 --durations=15; a=$?; python -m pytest -q tests -m serial -rf -o faulthandler_timeout=240; b=$?; exit $(( a || b ))' 2>&1 | Tee-Object -FilePath windows-results.txt
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
        shell: pwsh
      - name: show Windows failure diagnostics
        if: always()
        shell: pwsh
        env:
          BACKEND_OUTCOME: ${{ steps.windows-backend.outcome }}
        run: |
          if ($env:BACKEND_OUTCOME -eq 'failure' -and (Test-Path windows-results.txt)) {
            Get-Content windows-results.txt -Tail 250
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: windows-results, path: glacier/backend/windows-results.txt}
