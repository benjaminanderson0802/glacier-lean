# Windows packaging and smoke checks are non-blocking while the first runner results are reviewed.
name: desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "glacier/**"
      - "setup/pybundle/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v0.1.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            glacier/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            desktop/src-tauri/target
          key: windows-cargo-1.92-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/Cargo.toml') }}
          restore-keys: windows-cargo-1.92-
      - name: Build bundled Windows Python runtime
        run: python setup/pybundle/build_runtime.py --platform x86_64-pc-windows-msvc
      - name: Install screen dependencies
        working-directory: glacier/web
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build NSIS installer
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.windows.conf.json
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: glacier-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Smoke test installed backend
        shell: pwsh
        run: ./desktop/scripts/smoke_windows.ps1 -Installer (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1 -ExpandProperty FullName)
      - name: Upload first automation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glacier-windows-first-automation-evidence
          path: ${{ runner.temp }}/glacier-first-automation-evidence.txt
          if-no-files-found: ignore
          retention-days: 7

  release-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            glacier/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Check updater signing secrets
        id: signing
        shell: bash
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" && -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build bundled Windows Python runtime
        if: steps.signing.outputs.configured == 'true'
        run: python setup/pybundle/build_runtime.py --platform x86_64-pc-windows-msvc
      - name: Set release tag
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_RELEASE_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Skip signed release when signing secrets are missing
        if: steps.signing.outputs.configured != 'true'
        run: echo "Updater release skipped. Add TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD as GitHub Actions secrets."
      - name: Install screen dependencies
        if: steps.signing.outputs.configured == 'true'
        working-directory: glacier/web
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        if: steps.signing.outputs.configured == 'true'
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build, sign and publish Windows updater files
        if: steps.signing.outputs.configured == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Glacier ${{ env.RELEASE_TAG }}
          releaseBody: "Glacier desktop update ${{ env.RELEASE_TAG }}"
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.windows.conf.json
          tauriScript: npm run tauri --

  linux-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            glacier/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            librsvg2-dev patchelf libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Build bundled Linux Python runtime
        run: python3 setup/pybundle/build_runtime.py --platform x86_64-unknown-linux-gnu
      - name: Install screen dependencies
        working-directory: glacier/web
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build .deb and AppImage
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.linux.conf.json --bundles deb,appimage
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: glacier-linux-packages
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Smoke test extracted Linux packages
        run: |
          deb="$(find desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          appimage="$(find desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          ./desktop/scripts/smoke_unix.sh --deb "$deb"
          ./desktop/scripts/smoke_unix.sh --appimage "$appimage"

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            glacier/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build bundled Apple Silicon Python runtime
        run: python3 setup/pybundle/build_runtime.py --platform aarch64-apple-darwin
      - name: Install screen dependencies
        working-directory: glacier/web
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build macOS app and disk image
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.macos.conf.json --bundles app,dmg
      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: glacier-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Smoke test backend in app bundle
        run: |
          app="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          ./desktop/scripts/smoke_unix.sh --app "$app"
