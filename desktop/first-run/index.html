<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glacier</title>
  <!-- Same theme as the main screen: theme/tokens.css is a byte-for-byte copy of glacier/web/src/theme/tokens.css
       (desktop/test_first_run_theme.sh fails if they drift). Colours, fonts and radii come only from its tokens. -->
  <link rel="stylesheet" href="theme/tokens.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: var(--g-void); }
    body { min-height: 100vh; box-sizing: border-box; padding: 24px 0; background: url('theme/limbo/room.webp') center / cover no-repeat; font-family: var(--g-font-body); font-size: var(--g-size-body); color: var(--g-text); display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
    main { width: min(720px, 92vw); background: linear-gradient(160deg, var(--g-ice3), var(--l-glass-deep)), var(--l-glass); border: var(--g-border) solid var(--l-edge); border-radius: var(--l-radius); box-shadow: 0 12px 40px var(--g-shadow); backdrop-filter: blur(18px); overflow: hidden; text-shadow: var(--l-text-shadow); }
    header { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 22px; border-bottom: var(--g-border) solid var(--g-line); font-family: var(--g-font-head); font-weight: 700; font-size: 26px; color: var(--g-head); }
    section { padding: 18px 22px 20px; }
    h1 { margin: 0; font-family: var(--g-font-head); font-weight: 600; font-size: var(--g-size-title); color: var(--g-head); }
    .sub { color: var(--g-sub); font-size: var(--g-size-h2); margin: 4px 0 14px; }
    .panel { background: var(--g-ice2); border: var(--g-border) solid var(--g-line); border-radius: var(--l-radius-sm); padding: 10px 16px; margin-bottom: 14px; }
    .panel h2 { margin: 2px 0 6px; font-family: var(--g-font-head); font-weight: 500; font-size: var(--g-size-h2); color: var(--g-head); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 8px 2px; border-bottom: 1px solid var(--g-line-dim); }
    li:last-child { border-bottom: 0; }
    li .when { margin-left: auto; color: var(--g-muted); font-size: var(--g-size-small); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g-line-dim); flex: none; }
    .yes .dot { background: var(--g-ok); box-shadow: 0 0 6px var(--g-ok); }
    .no .dot { background: var(--g-warn); }
    .note { color: var(--g-muted); font-size: var(--g-size-small); }
    .status { display: flex; align-items: center; gap: 12px; color: var(--g-sub); }
    .status .bar { flex: 1; height: 8px; border: var(--g-border) solid var(--g-line); border-radius: 999px; padding: 2px; background: var(--g-bar); overflow: hidden; }
    .status .bar i { display: block; height: 100%; width: 30%; border-radius: 999px; background: var(--g-accent); animation: slide 1.6s ease-in-out infinite alternate; }
    @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
    @media (prefers-reduced-motion: reduce) { .status .bar i { animation: none; } }
    [hidden] { display: none !important; }
    #startup-error { color: var(--g-bad); font-size: var(--g-size-small); }
    button { height: 40px; padding: 0 20px; background: var(--l-pill); border: 1px solid var(--l-edge); border-radius: 999px; color: var(--l-pill-ink); font-family: var(--g-font-body); font-size: var(--g-size-body); cursor: pointer; }
    button:hover { background: var(--l-pill-hi); }
    button:focus-visible { outline: 2px solid var(--g-head); outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <header>glacier</header>
  <section>
    <h1>Welcome to Glacier</h1>
    <div class="sub">Starting your local engine. Everything stays on this computer.</div>
    <div class="panel">
      <div class="status" id="starting" role="status"><span>starting…</span><div class="bar" aria-hidden="true"><i></i></div></div>
      <p id="startup-error" role="alert" hidden></p>
    </div>
    <div class="panel">
      <h2>tools on this computer</h2>
      <ul id="tools"><li><span class="dot"></span>Checking this computer…</li></ul>
    </div>
    <p class="note">Glacier needs Git to keep a history of your notes. The AI tools are optional. This list stays on this computer.</p>
    <button id="check-again">check again</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
