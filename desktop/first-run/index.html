<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glacier</title>
  <!-- Same theme as the main screen: theme/tokens.css is a byte-for-byte copy of glacier/web/src/theme/tokens.css
       (desktop/test_first_run_theme.sh fails if they drift). Colours, fonts and radii come only from its tokens. -->
  <link rel="stylesheet" href="theme/tokens.css">
  <style>
    html, body { margin: 0; height: 100%; background: var(--g-void); }
    body { font-family: var(--g-font-body); font-size: var(--g-size-body); color: var(--g-text); display: grid; place-items: center; -webkit-font-smoothing: none; }
    main { width: min(720px, 92vw); background: var(--g-bg); border: var(--g-border) solid var(--g-line); border-radius: var(--g-radius); box-shadow: var(--g-glow); }
    header { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 16px; background: var(--g-bar); border-bottom: var(--g-border) solid var(--g-line); font-family: var(--g-font-head); font-weight: 700; font-size: 30px; color: var(--g-head); }
    header svg { image-rendering: pixelated; }
    section { padding: 18px 22px 20px; }
    h1 { margin: 0; font-family: var(--g-font-head); font-weight: 600; font-size: var(--g-size-title); color: var(--g-head); }
    .sub { color: var(--g-sub); font-size: var(--g-size-h2); margin: 4px 0 14px; }
    .panel { background: var(--g-panel); border: var(--g-border) solid var(--g-line); border-radius: var(--g-radius); box-shadow: var(--g-glow); padding: 10px 16px; margin-bottom: 14px; }
    .panel h2 { margin: 2px 0 6px; font-family: var(--g-font-head); font-weight: 500; font-size: var(--g-size-h2); color: var(--g-head); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 8px 2px; border-bottom: 1px solid var(--g-line-dim); }
    li:last-child { border-bottom: 0; }
    li .when { margin-left: auto; color: var(--g-muted); font-size: var(--g-size-small); }
    .dot { width: 12px; height: 12px; background: var(--g-line-dim); flex: none; }
    .yes .dot { background: var(--g-ok); box-shadow: 0 0 6px var(--g-ok); }
    .no .dot { background: var(--g-warn); }
    .note { color: var(--g-muted); font-size: var(--g-size-small); }
    .status { display: flex; align-items: center; gap: 12px; color: var(--g-sub); }
    .status .bar { flex: 1; height: 16px; border: var(--g-border) solid var(--g-line); border-radius: var(--g-radius-bar); padding: 2px; background: var(--g-bar); }
    .status .bar i { display: block; height: 100%; width: 30%; border-radius: var(--g-radius-bar-in); background: var(--g-accent); animation: slide 1.6s steps(8) infinite; }
    @keyframes slide { 0% { margin-left: 0 } 100% { margin-left: 70% } }
    #startup-error { color: var(--g-bad); font-size: var(--g-size-small); }
    button { height: 40px; padding: 0 16px; background: var(--g-panel); border: 1px solid var(--g-text); border-radius: var(--g-radius-btn); color: var(--g-head); font-family: var(--g-font-body); font-size: var(--g-size-body); cursor: pointer; }
    button:hover { background: var(--g-panel-hi); }
  </style>
</head>
<body>
<main>
  <header><svg width="78" height="45" viewBox="0 0 26 15" shape-rendering="crispEdges" aria-hidden="true">
    <path d="M9 0h1v1h1v1h1v1h1v12H0v-2h1v-2h1v-2h1V8h1V6h1V5h1V3h1V2h1V1h1z" style="fill:var(--g-accent)"/>
    <path d="M18 4h1v1h1v1h1v1h1v1h1v1h1v1h1v5H13V9h1V8h1V7h1V6h1V5h1z" style="fill:var(--g-line)"/>
    <path d="M9 0h1v1h1v1h1v1h-1v1H8V3H7V2h1V1h1zM18 4h1v1h1v1h-1v1h-2V6h-1V5h1z" style="fill:var(--g-head)"/>
  </svg>Glacier</header>
  <section>
    <h1>Welcome to Glacier</h1>
    <div class="sub">Starting your local engine. Everything stays on this computer.</div>
    <div class="panel">
      <div class="status" id="starting"><span>Starting…</span><div class="bar"><i></i></div></div>
      <p id="startup-error" role="alert" hidden></p>
    </div>
    <div class="panel">
      <h2>Tools on this computer</h2>
      <ul id="tools"><li><span class="dot"></span>Checking this computer…</li></ul>
    </div>
    <p class="note">All of these are optional. Glacier works without them and never sends this list anywhere.</p>
    <button id="check-again">Check again</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
